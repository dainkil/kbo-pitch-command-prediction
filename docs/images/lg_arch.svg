<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="214" viewBox="0 0 600 214" font-family="'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif">
  <title>LG Aimers 9기 KBO 제구 등급 예측 — 아키텍처</title>
  <defs>
    <style>
      .box  { fill:#FFFFFF; stroke:#1A1A1A; stroke-width:1.1; }
      .mine { fill:#FFFFFF; stroke:#2B5C8A; stroke-width:2.2; }
      .key  { fill:#F4F4F4; stroke:#1A1A1A; stroke-width:1.1; }
      .zone { fill:#F4F4F4; stroke:#1A1A1A; stroke-width:1; stroke-dasharray:5 3; }
      .grp  { fill:#FFFFFF; stroke:#1A1A1A; stroke-width:1; }
      .h    { font-size:12.5px; font-weight:700; fill:#1A1A1A; }
      .s    { font-size:10px; fill:#3A3A3A; }
      .z    { font-size:10px; font-weight:700; fill:#1A1A1A; }
      .zb   { font-size:10px; font-weight:700; fill:#2B5C8A; }
      .main { fill:none; stroke:#2B5C8A; stroke-width:1.8; }
      .dep  { fill:none; stroke:#1A1A1A; stroke-width:1.1; }
    </style>
    <marker id="aMain" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0.5 L8,4.5 L0,8.5 Z" fill="#2B5C8A"/>
    </marker>
    <marker id="aDep" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="3" y="74" width="62" height="66" rx="4" class="box"/>
  <text x="34" y="97" text-anchor="middle" class="h">입력</text>
  <text x="34" y="113" text-anchor="middle" class="s">투구 직전</text>
  <text x="34" y="127" text-anchor="middle" class="s">29열</text>

  <!-- scoring-server zone -->
  <rect x="78" y="3" width="519" height="208" rx="6" class="zone"/>
  <rect x="88" y="11" width="9" height="9" rx="1.5" fill="#FFFFFF" stroke="#2B5C8A" stroke-width="2"/>
  <text x="102" y="19.5" class="zb">본인 기여</text>
  <text x="589" y="19.5" text-anchor="end" class="z">채점 서버 · 6 vCPU · 10분 · 인터넷 차단</text>

  <!-- A: pitcher axis -->
  <rect x="88" y="27" width="346" height="84" rx="5" class="grp"/>
  <text x="96" y="41" class="z">A. 투수 축 → Player (투수 순위)</text>
  <rect x="96" y="48" width="104" height="54" rx="4" class="box"/>
  <text x="148" y="70" text-anchor="middle" class="h">EB 수축</text>
  <text x="148" y="87" text-anchor="middle" class="s">투수 이력 평균</text>
  <rect x="213" y="48" width="104" height="54" rx="4" class="mine"/>
  <text x="265" y="70" text-anchor="middle" class="h">볼카운트 행 항</text>
  <text x="265" y="87" text-anchor="middle" class="s">상황 보정 · 릿지</text>
  <rect x="330" y="48" width="96" height="54" rx="4" class="key"/>
  <text x="378" y="70" text-anchor="middle" class="h">t</text>
  <text x="378" y="87" text-anchor="middle" class="s">목표 제구점수</text>

  <!-- B: pitch axis -->
  <rect x="88" y="119" width="346" height="84" rx="5" class="grp"/>
  <text x="96" y="133" class="z">B. 투구 축 → Pitch (Brier)</text>
  <rect x="96" y="140" width="104" height="54" rx="4" class="mine"/>
  <text x="148" y="162" text-anchor="middle" class="h">LightGBM ×2</text>
  <text x="148" y="179" text-anchor="middle" class="s">본인·팀원 각 5시드</text>
  <rect x="213" y="140" width="104" height="54" rx="4" class="mine"/>
  <text x="265" y="162" text-anchor="middle" class="h">앙상블 + 온도</text>
  <text x="265" y="179" text-anchor="middle" class="s">0.5 : 0.5 · T = 0.9</text>
  <rect x="330" y="140" width="96" height="54" rx="4" class="key"/>
  <text x="378" y="162" text-anchor="middle" class="h">q</text>
  <text x="378" y="179" text-anchor="middle" class="s">3등급 확률</text>

  <!-- projection + output -->
  <rect x="452" y="44" width="136" height="72" rx="4" class="mine"/>
  <text x="520" y="66" text-anchor="middle" class="h">사영 결합</text>
  <text x="520" y="84" text-anchor="middle" class="s">p = proj(q, t)</text>
  <text x="520" y="100" text-anchor="middle" class="s">q 변경 → Player 불변</text>
  <rect x="452" y="140" width="136" height="54" rx="4" class="box"/>
  <text x="520" y="162" text-anchor="middle" class="h">출력</text>
  <text x="520" y="179" text-anchor="middle" class="s">투구별 3등급 확률</text>

  <!-- flows -->
  <path d="M65,107 L84,107 L84,75 L95,75" class="main" marker-end="url(#aMain)"/>
  <path d="M84,107 L84,167 L95,167" class="main" marker-end="url(#aMain)"/>
  <path d="M200,75 L212,75" class="main" marker-end="url(#aMain)"/>
  <path d="M317,75 L329,75" class="main" marker-end="url(#aMain)"/>
  <path d="M200,167 L212,167" class="main" marker-end="url(#aMain)"/>
  <path d="M317,167 L329,167" class="main" marker-end="url(#aMain)"/>
  <path d="M426,75 L451,75" class="main" marker-end="url(#aMain)"/>
  <path d="M426,167 L440,167 L440,100 L451,100" class="main" marker-end="url(#aMain)"/>
  <path d="M520,116 L520,139" class="dep" marker-end="url(#aDep)"/>
</svg>
