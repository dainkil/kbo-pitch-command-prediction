<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Helvetica Neue, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif" font-size="13" fill="#111">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#fff"/>

  <!-- ===== Input ===== -->
  <rect x="120" y="24" width="760" height="58" rx="4" fill="#f2f2f2" stroke="#111" stroke-width="1.2"/>
  <text x="500" y="47" text-anchor="middle" font-size="14" font-weight="700">입력: 투구 직전 정보 29열 (사후 정보 없음)</text>
  <text x="500" y="69" text-anchor="middle" fill="#333">상황(볼카운트 · 이닝 · 주자 · 점수차 · 아웃) · 투수 ID · 시즌 · 경기 유형(1군/2군)</text>

  <!-- split arrows -->
  <path d="M400,82 L400,104 L245,104 L245,126" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
  <path d="M600,82 L600,104 L755,104 L755,126" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== Branch A (ranking) ===== -->
  <rect x="40" y="126" width="410" height="372" rx="6" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="40" y="126" width="410" height="30" rx="6" fill="#111"/>
  <text x="245" y="146" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">A. 투수 축 — "이 투수는 평균 몇 점짜리인가"</text>

  <rect x="70" y="176" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="245" y="197" text-anchor="middle" font-weight="700">① 과거 이력 집계</text>
  <text x="245" y="217" text-anchor="middle" fill="#333" font-size="12">이전 시즌 투구만 사용 · 미기록 투구는 대리등급으로 보충</text>
  <path d="M245,232 L245,256" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="70" y="258" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="245" y="279" text-anchor="middle" font-weight="700">② 평균 회귀 (Empirical Bayes 수축)</text>
  <text x="245" y="299" text-anchor="middle" fill="#333" font-size="12">이력이 적을수록 "비슷한 기용 상황의 평균" 쪽으로 강하게 당김</text>
  <path d="M245,314 L245,338" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="70" y="340" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="245" y="361" text-anchor="middle" font-weight="700">③ 볼카운트 상황 보정</text>
  <text x="245" y="381" text-anchor="middle" fill="#333" font-size="12">투수 점수 + 상황 효과 (볼 −5.7 · 스트라이크 +2.5 · 주자 −1.4 …)</text>
  <path d="M245,396 L245,420" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="70" y="422" width="350" height="56" rx="3" fill="#e8e8e8" stroke="#111" stroke-width="1.4"/>
  <text x="245" y="445" text-anchor="middle" font-weight="700" font-size="14">t = 이 투구의 목표 제구점수 (0~100)</text>
  <text x="245" y="465" text-anchor="middle" fill="#333" font-size="12">투수별 평균을 내면 곧 투수 순위</text>

  <!-- ===== Branch B (probability) ===== -->
  <rect x="550" y="126" width="410" height="372" rx="6" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="550" y="126" width="410" height="30" rx="6" fill="#111"/>
  <text x="755" y="146" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">B. 투구 축 — "이 상황에서 세 등급 확률은"</text>

  <rect x="580" y="176" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="755" y="197" text-anchor="middle" font-weight="700">① LightGBM ×2 (각 5시드)</text>
  <text x="755" y="217" text-anchor="middle" fill="#333" font-size="12">상황 + 투수 이력 + 시즌 피처 69개 · 3-class 확률</text>
  <path d="M755,232 L755,256" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="580" y="258" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="755" y="279" text-anchor="middle" font-weight="700">② 앙상블</text>
  <text x="755" y="299" text-anchor="middle" fill="#333" font-size="12">두 모델 확률의 0.5 : 0.5 평균</text>
  <path d="M755,314 L755,338" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="580" y="340" width="350" height="56" rx="3" fill="#fff" stroke="#111"/>
  <text x="755" y="361" text-anchor="middle" font-weight="700">③ 온도 보정 (T = 0.9)</text>
  <text x="755" y="381" text-anchor="middle" fill="#333" font-size="12">표본외 데이터에서 Brier 최소가 되도록 확률 날카로움 조정</text>
  <path d="M755,396 L755,420" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="580" y="422" width="350" height="56" rx="3" fill="#e8e8e8" stroke="#111" stroke-width="1.4"/>
  <text x="755" y="445" text-anchor="middle" font-weight="700" font-size="14">q = (q_Shadow, q_Heart, q_Failure)</text>
  <text x="755" y="465" text-anchor="middle" fill="#333" font-size="12">상황만 보고 낸 확률 분포</text>

  <!-- arrows into projection -->
  <path d="M245,498 L245,530" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
  <path d="M755,498 L755,530" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== Projection ===== -->
  <rect x="120" y="532" width="760" height="70" rx="4" fill="#f2f2f2" stroke="#111" stroke-width="1.4"/>
  <text x="500" y="555" text-anchor="middle" font-size="14" font-weight="700">C. 사영 결합 — q 에 가장 가까우면서 기대점수가 t 가 되는 확률</text>
  <text x="500" y="577" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-style="italic">p = q + ((t − q·G) / (G·v)) · v,   G = (100, 30, 0),   100·p_S + 30·p_H = t,   Σp = 1</text>
  <text x="500" y="595" text-anchor="middle" fill="#333" font-size="12">B 를 바꿔도 투수별 평균 점수는 그대로 → 두 축을 독립적으로 개선 가능</text>

  <path d="M500,602 L500,628" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ===== Output ===== -->
  <rect x="310" y="630" width="380" height="46" rx="4" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="500" y="650" text-anchor="middle" font-size="14" font-weight="700">출력: 투구별 3등급 확률 p</text>
  <text x="500" y="668" text-anchor="middle" fill="#333" font-size="12">투구별 정확도 (Brier)  ·  투수별 평균 점수 → 순위 (Kendall τ)</text>

  <!-- side annotations -->
  <text x="150" y="655" text-anchor="middle" fill="#333" font-size="12">A 가 결정 → 투수 순위</text>
  <path d="M215,652 L305,652" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="850" y="655" text-anchor="middle" fill="#333" font-size="12">B 가 결정 → 투구별 정확도</text>
  <path d="M785,652 L695,652" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah)"/>
</svg>
